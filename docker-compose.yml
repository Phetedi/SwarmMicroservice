version: "3"

services:
  redis:
    image: redis:alpine
    networks:
      - voting_app_net

  db:
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - voting_app_net

  voting:
    image: dockersamples/examplevotingapp_vote
    ports:
      - "5000:80"
    networks:
      - voting_app_net

  result:
    image: dockersamples/examplevotingapp_result
    ports:
      - "5001:80"
    networks:
      - voting_app_net

  worker:
    image: dockersamples/examplevotingapp_worker
    networks:
      - voting_app_net

  visualizer:
    image: alexellis2/visualizer-arm:latest
    ports:
      - "8000:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - voting_app_net

networks:
  voting_app_net:
    driver: overlay

volumes:
  db_data:
